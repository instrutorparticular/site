<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Entrar | Instrutor Particular</title>
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #F0D84E;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            background: #FFFFFF;
            border: 3px solid #000000;
            border-radius: 20px;
            padding: 40px 35px;
            max-width: 420px;
            width: 100%;
            box-shadow: 10px 10px 0 #000000;
        }

        .logo-area {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .logo-circle {
            width: 110px;
            height: 110px;
            background: #FFFFFF;
            border: 4px solid #000000;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 4px 4px 0 #F0D84E;
        }

        .logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 900;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            height: 50px;
            padding: 0 14px;
            border: 2px solid #000000;
            border-radius: 9px;
            background: #F7F7F7;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus {
            background: #FFFFFF;
            box-shadow: 4px 4px 0 #F0D84E;
        }

        button {
            width: 100%;
            height: 55px;
            border: 3px solid #000000;
            border-radius: 9px;
            background: #000000;
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        button:hover:not(:disabled) {
            background: #F0D84E;
            color: #000000;
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0 #000000;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .erro {
            background: #FFE5E5;
            border-left: 4px solid #D32F2F;
            padding: 12px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 15px;
            font-size: 13px;
            color: #B71C1C;
            display: none;
            line-height: 1.5;
        }

        .erro.visivel { display: block; }

        .link-voltar {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
        }

        .link-voltar a {
            color: #666;
            text-decoration: none;
        }

        .link-voltar a:hover {
            color: #000;
            text-decoration: underline;
        }

        .loading-text {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        .loading-text.visivel {
            display: block;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo-area">
            <div class="logo-circle">
                <img src="logo.png" alt="Instrutor Particular">
            </div>
        </div>

        <h1>ÁREA DO INSTRUTOR</h1>
        <p class="subtitulo">Acesse seu painel individual</p>

        <div id="erro" class="erro"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seuemail@exemplo.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required autocomplete="current-password">
            </div>

            <button type="submit" id="btnEntrar">
                <span>ENTRAR</span>
            </button>
        </form>

        <p class="link-voltar">
            <a href="index.html">← Voltar para o site</a>
        </p>
    </div>

    <script>
        /* ========================================
           ⚙️ CONFIGURAÇÃO
           Cole aqui a URL do Web App que você
           copiou na Etapa 2 (Passo 2.10)
        ======================================== */
        const API_URL = "https://script.google.com/macros/s/AKfycbxQGLAB8VLT1YRQc7GcL76fKNdnLVvEjky7OIDmccYDVTqSQyAiOEa6wgvx8-ndt6D1/exec";

        /* ========================================
           ELEMENTOS
        ======================================== */
        const form = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const senhaInput = document.getElementById("senha");
        const btnEntrar = document.getElementById("btnEntrar");
        const erroBox = document.getElementById("erro");

        /* ========================================
           VERIFICA SE JÁ ESTÁ LOGADO
        ======================================== */
        const tokenSalvo = localStorage.getItem("instrutor_token");
        if (tokenSalvo) {
            window.location.href = "painel.html";
        }

        /* ========================================
           SUBMIT DO FORMULÁRIO
        ======================================== */
        form.addEventListener("submit", async function(e) {
            e.preventDefault();

            erroBox.classList.remove("visivel");
            btnEntrar.disabled = true;
            btnEntrar.querySelector("span").textContent = "ENTRANDO...";

            try {
                const resposta = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        acao: "login",
                        email: emailInput.value.trim(),
                        senha: senhaInput.value
                    })
                });

                const dados = await resposta.json();

                if (dados.sucesso) {
                    /* Salva token e dados do instrutor */
                    localStorage.setItem("instrutor_token", dados.token);
                    localStorage.setItem("instrutor_dados", JSON.stringify(dados.instrutor));

                    /* Redireciona para o painel */
                    window.location.href = "painel.html";
                } else {
                    erroBox.textContent = dados.erro || "Erro ao fazer login.";
                    erroBox.classList.add("visivel");
                    btnEntrar.disabled = false;
                    btnEntrar.querySelector("span").textContent = "ENTRAR";
                }

            } catch (erro) {
                console.error("Erro:", erro);
                erroBox.textContent = "Erro de conexão. Verifique sua internet e tente novamente.";
                erroBox.classList.add("visivel");
                btnEntrar.disabled = false;
                btnEntrar.querySelector("span").textContent = "ENTRAR";
            }
        });
    </script>

</body>
</html>
