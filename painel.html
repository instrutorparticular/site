<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Painel do Instrutor | Instrutor Particular</title>
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #F7F7F7;
            min-height: 100vh;
            color: #000;
        }

        /* ========================================
           TOPBAR
        ======================================== */
        .topbar {
            background: #000000;
            color: #FFFFFF;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .topbar-brand .dot {
            width: 10px;
            height: 10px;
            background: #F0D84E;
            border-radius: 50%;
        }

        .topbar-user {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 13px;
        }

        .btn-sair {
            background: transparent;
            border: 2px solid #F0D84E;
            color: #F0D84E;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-sair:hover {
            background: #F0D84E;
            color: #000;
        }

        /* ========================================
           CONTAINER
        ======================================== */
        .container {
            max-width: 1100px;
            margin: auto;
            padding: 30px 20px;
        }

        /* ========================================
           BOAS-VINDAS
        ======================================== */
        .boas-vindas {
            background: #FFFFFF;
            border: 3px solid #000000;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 8px 8px 0 #F0D84E;
            margin-bottom: 30px;
        }

        .boas-vindas h1 {
            font-size: 28px;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .boas-vindas p {
            color: #666;
            font-size: 14px;
        }

        /* ========================================
           SEÇÃO TÍTULO
        ======================================== */
        .secao-titulo {
            font-size: 18px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 3px solid #F0D84E;
            display: inline-block;
        }

        /* ========================================
           INFO BOX
        ======================================== */
        .info-box {
            background: #FFFFFF;
            border: 2px solid #000000;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 5px 5px 0 #F0D84E;
            margin-bottom: 30px;
        }

        .info-linha {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #EEEEEE;
            font-size: 14px;
        }

        .info-linha:last-child {
            border-bottom: none;
        }

        .info-linha strong {
            color: #000;
            font-weight: 900;
        }

        .info-linha span {
            color: #666;
            text-align: right;
        }

        /* ========================================
           CARD ÚNICO CENTRALIZADO (MEUS ALUNOS)
        ======================================== */
        .card-unico-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .card-unico {
            background: #FFFFFF;
            border: 2px solid #000000;
            border-radius: 15px;
            padding: 35px 60px;
            text-align: center;
            transition: 0.2s;
            text-decoration: none;
            color: #000;
            cursor: pointer;
            display: inline-block;
            min-width: 220px;
            box-shadow: 5px 5px 0 #F0D84E;
        }

        .card-unico:hover {
            transform: translate(-3px, -3px);
            box-shadow: 8px 8px 0 #F0D84E;
        }

        .card-unico .icone {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .card-unico h3 {
            font-size: 20px;
            margin-bottom: 6px;
            font-weight: 900;
        }

        .card-unico p {
            font-size: 13px;
            color: #666;
        }

        /* ========================================
           LOADING
        ======================================== */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #F0D84E;
            border-top-color: #000;
            border-radius: 50%;
            margin: 0 auto 15px;
            animation: girar 0.8s linear infinite;
        }

        @keyframes girar {
            to { transform: rotate(360deg); }
        }

        /* ========================================
           RESPONSIVO
        ======================================== */
        @media (max-width: 650px) {
            .boas-vindas h1 { font-size: 22px; }
            .topbar { flex-direction: column; align-items: flex-start; }
            .info-linha { flex-direction: column; gap: 4px; }
            .info-linha span { text-align: left; }
            .card-unico { padding: 30px 40px; min-width: unset; width: 100%; max-width: 280px; }
        }
    </style>
</head>
<body>

    <!-- ========================================
         TOPBAR
    ======================================== -->
    <div class="topbar">
        <div class="topbar-brand">
            <span class="dot"></span>
            INSTRUTOR PARTICULAR
        </div>
        <div class="topbar-user">
            <span id="nomeTopbar">Carregando...</span>
            <button class="btn-sair" id="btnSair">SAIR</button>
        </div>
    </div>

    <!-- ========================================
         CONTEÚDO
    ======================================== -->
    <div class="container">

        <!-- LOADING -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Carregando seu painel...</p>
        </div>

        <!-- CONTEÚDO PRINCIPAL -->
        <div id="conteudo" style="display:none;">

            <!-- BOAS-VINDAS -->
            <div class="boas-vindas">
                <h1>Olá, <span id="nomeInstrutor">Instrutor</span>! 👋</h1>
                <p>Bem-vindo ao seu painel. Aqui você acompanha seus dados e informações.</p>
            </div>

            <!-- MEUS DADOS -->
            <h2 class="secao-titulo">📋 Meus dados</h2>
            <div class="info-box">
                <div class="info-linha">
                    <strong>Nome:</strong>
                    <span id="dadoNome">—</span>
                </div>
                <div class="info-linha">
                    <strong>E-mail:</strong>
                    <span id="dadoEmail">—</span>
                </div>
                <div class="info-linha">
                    <strong>Telefone:</strong>
                    <span id="dadoTelefone">—</span>
                </div>
                <div class="info-linha">
                    <strong>Status:</strong>
                    <span id="dadoStatus">—</span>
                </div>
                <div class="info-linha">
                    <strong>Cadastro desde:</strong>
                    <span id="dadoData">—</span>
                </div>
            </div>

            <!-- ATALHOS (somente Meus Alunos, centralizado) -->
            <h2 class="secao-titulo">🚀 Atalhos</h2>
            <div class="card-unico-wrapper">
                <a class="card-unico" href="#">
                    <div class="icone">👨‍🎓</div>
                    <h3>Meus alunos</h3>
                    <p>Em breve</p>
                </a>
            </div>

        </div>
    </div>

    <script>
        /* ========================================
           ⚙️ CONFIGURAÇÃO
           Cole aqui a MESMA URL do Web App
           que você usou no login.html
        ======================================== */
        const API_URL = "https://script.google.com/macros/s/AKfycbxQGLAB8VLT1YRQc7GcL76fKNdnLVvEjky7OIDmccYDVTqSQyAiOEa6wgvx8-ndt6D1/exec";

        /* ========================================
           VERIFICA LOGIN
        ======================================== */
        const token = localStorage.getItem("instrutor_token");

        if (!token) {
            window.location.href = "login.html";
        }

        /* ========================================
           CARREGA PERFIL
        ======================================== */
        async function carregarPerfil() {
            try {
                const resposta = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        acao: "perfil",
                        token: token
                    })
                });

                const dados = await resposta.json();

                if (dados.sucesso) {
                    const p = dados.perfil;

                    /* Preenche dados na tela */
                    document.getElementById("nomeTopbar").textContent = p.nome;
                    document.getElementById("nomeInstrutor").textContent = p.nome.split(" ")[0];
                    document.getElementById("dadoNome").textContent = p.nome;
                    document.getElementById("dadoEmail").textContent = p.email;
                    document.getElementById("dadoTelefone").textContent = p.telefone || "—";
                    document.getElementById("dadoStatus").textContent = p.status;
                    document.getElementById("dadoData").textContent = p.dataCadastro || "—";

                    /* Mostra conteúdo */
                    document.getElementById("loading").style.display = "none";
                    document.getElementById("conteudo").style.display = "block";

                } else {
                    /* Sessão expirada ou erro */
                    alert("Sessão expirada. Faça login novamente.");
                    localStorage.removeItem("instrutor_token");
                    localStorage.removeItem("instrutor_dados");
                    window.location.href = "login.html";
                }

            } catch (erro) {
                console.error("Erro:", erro);
                alert("Erro ao carregar dados. Faça login novamente.");
                localStorage.removeItem("instrutor_token");
                localStorage.removeItem("instrutor_dados");
                window.location.href = "login.html";
            }
        }

        /* ========================================
           BOTÃO SAIR
        ======================================== */
        document.getElementById("btnSair").addEventListener("click", function() {
            if (confirm("Deseja realmente sair?")) {
                localStorage.removeItem("instrutor_token");
                localStorage.removeItem("instrutor_dados");
                window.location.href = "login.html";
            }
        });

        /* ========================================
           INICIALIZAÇÃO
        ======================================== */
        carregarPerfil();
    </script>

</body>
</html>
